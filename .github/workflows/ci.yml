name: ci

# The check every PR needs before it can merge: `pnpm test` (lint, types,
# the tests inside workerd and the config check of every environment), on
# every commit of a PR and every push to main. Deploys nothing. The deploy,
# release and promote workflows come with the infrastructure (docs/deployment.md).

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Runtime types are up to date
        run: |
          pnpm types
          git diff --exit-code -- worker-configuration.d.ts || { echo "::error::Run pnpm types and commit worker-configuration.d.ts"; exit 1; }

      - run: pnpm test
