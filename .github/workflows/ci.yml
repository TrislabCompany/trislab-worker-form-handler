name: ci

# The check every PR needs before it can merge, on every commit of a PR and
# every push to main. Its steps are in checks.yml, so the check is named
# `ci / ci`, as the ruleset of main requires. Deploys nothing; the deploy,
# release and promote workflows are described in docs/deployment.md.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
